name: Build OricMamp app

# Builds the OricMamp desktop app for Linux, Windows, and macOS on GitHub's
# machines and publishes downloadable archives to the `app-v1` release. macOS
# signs ad-hoc (CODE_SIGN_IDENTITY "-"), so no certificate is needed.
#
# Run it from the Actions tab (Run workflow) after the workflow file is added.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Enable desktop + fetch packages
        run: |
          flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop
          flutter pub get

      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }} --release

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          tar czf "$GITHUB_WORKSPACE/OricMamp-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath OricMamp-windows-x64.zip -Force

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: |
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/OricMamp.app \
            "$GITHUB_WORKSPACE/OricMamp-macos.zip"

      - name: Publish to app-v1 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release create app-v1 --repo "$REPO" \
            --title "OricMamp app" \
            --notes "Downloadable OricMamp desktop app (Linux/Windows). macOS is built locally." \
            || true
          case "${{ matrix.target }}" in
            linux)   gh release upload app-v1 OricMamp-linux-x64.tar.gz  --clobber --repo "$REPO" ;;
            windows) gh release upload app-v1 OricMamp-windows-x64.zip   --clobber --repo "$REPO" ;;
            macos)   gh release upload app-v1 OricMamp-macos.zip         --clobber --repo "$REPO" ;;
          esac
